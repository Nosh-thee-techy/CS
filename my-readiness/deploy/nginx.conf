# readiness.<platform-domain>.co.ke
# Serve the Vite build and proxy API calls to this repo's Express BFF.
# The BFF then calls the core platform internal API — no database access from here.

server {
    listen 80;
    server_name readiness.example.co.ke;

    root /var/www/my-readiness/frontend/dist;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://127.0.0.1:3001/health;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
